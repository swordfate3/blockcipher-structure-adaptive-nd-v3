[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cipher-experiments"
version = "0.1.0"
description = "Standalone, configuration-driven cipher prediction experiments"
requires-python = ">=3.12,<3.13"
dependencies = ["torch>=2.4,<3", "numpy>=2,<3"]

[project.optional-dependencies]
sat = ["python-sat>=1.8.dev24,<2"]

[project.scripts]
cipher-experiments = "cipher_experiments.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["backups", ".rebuild", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
