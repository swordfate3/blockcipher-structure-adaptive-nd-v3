[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cipher-lab"
version = "0.1.0"
description = "Independent CPU-only integral empirical experiment backend"
requires-python = ">=3.12"
dependencies = ["torch>=2.6", "numpy>=2.0"]

[project.scripts]
cipher-lab = "cipher_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cipher_lab", "cipher_lab.*"]

[tool.pytest.ini_options]
# Each experiment has one explicit owner. Relations' existing tests still live
# under tests/test_differential_relations_*.py; its future owner path is reserved.
testpaths = [
    "tests",
    "plugins/cipher_lab_plugins/differential_relations/tests",
    "plugins/cipher_lab_plugins/residual/tests",
    "plugins/cipher_lab_plugins/feature_probe/tests",
    "plugins/cipher_lab_plugins/frontier/tests",
    "plugins/cipher_lab_plugins/fourier/tests",
    "plugins/cipher_lab_plugins/speck_study/tests",
    "plugins/cipher_lab_plugins/integral_search/tests",
    "plugins/cipher_lab_plugins/innovation1/tests",
]
addopts = "-q -p plugin_isolation -m 'not science'"
markers = ["science: original real cipher/NN/optimizer/RSS cases; separate permission required"]
pythonpath = [
    "src", "plugins", "tests",
    "plugins/cipher_lab_plugins/differential_relations/tests",
    "plugins/cipher_lab_plugins/residual/tests",
    "plugins/cipher_lab_plugins/feature_probe/tests",
    "plugins/cipher_lab_plugins/frontier/tests",
    "plugins/cipher_lab_plugins/fourier/tests",
    "plugins/cipher_lab_plugins/speck_study/tests",
    "plugins/cipher_lab_plugins/integral_search/tests",
    "plugins/cipher_lab_plugins/innovation1/tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# execution is in the SPECK main Python3.10 closure: UTC was added in 3.11.
# The provider3.9 typing-Callable exemptions stay inline with their source owners.
[tool.ruff.lint.per-file-ignores]
"src/cipher_lab/execution.py" = ["UP017"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "plugins"]
mypy_path = ["src", "tests", "plugins"]
